<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Сборка наборов — КМ-трекинг</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14171C; --surface:#1A1E24; --surface-2:#20252C; --surface-3:#2A3039; --border:#333A44;
    --text:#EDEFF2; --text-dim:#8E97A3; --text-faint:#5B636F;
    --accent:#6C97C2; --accent-wash:#1C2733;
    --ok:#4FAE7C; --ok-dim:#1C2A22; --err:#D9686C; --err-dim:#332120; --warn:#D8AB55;
    --mono: 'JetBrains Mono', ui-monospace, "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    --sans: 'Inter', -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--bg); color:var(--text); font-family:var(--sans); font-size:15px; line-height:1.55; min-height:100vh; -webkit-font-smoothing:antialiased; }
  a, button, input, select{ font-family:inherit; }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  header{ padding:26px 28px 18px 28px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; max-width:1320px; margin:0 auto; }
  h1{ font-size:22px; font-weight:600; letter-spacing:-.005em; margin:0; }
  .header-status{ display:flex; align-items:center; gap:12px; }
  .conn-status{ font-size:13px; color:var(--text-dim); display:flex; align-items:center; }
  .conn-dot{ display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--ok); margin-right:7px; transition:background-color .2s; }
  .conn-dot.down{ background:var(--err); }

  main{ padding:24px 28px 64px 28px; max-width:1320px; margin:0 auto;}
  .view{ display:none; }
  .view.active{ display:block; }

  .consoles{ max-width:720px; }
  .console{ background:var(--surface); border:1px solid var(--border); border-radius:10px; overflow:hidden; transition:border-color .15s;}
  .console.flash-err{ border-color:var(--err); }
  .console.flash-ok{ border-color:var(--ok); }
  .console-head{ display:flex; align-items:center; justify-content:space-between; padding:14px 18px; background:var(--surface-2); border-bottom:1px solid var(--border); }
  .station-badge{ font-family:var(--mono); font-size:12.5px; color:var(--text-dim); background:var(--surface-3); border:1px solid var(--border); border-radius:6px; padding:5px 10px; cursor:pointer; }
  .station-badge:hover{ border-color:var(--accent); color:var(--text); }
  .station-modal-backdrop{ position:fixed; inset:0; background:rgba(10,12,15,.7); z-index:100; display:flex; align-items:center; justify-content:center; }
  .station-modal{ background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:30px; width:100%; max-width:400px; }
  .station-modal h2{ font-size:18px; font-weight:600; margin:0 0 8px 0;}
  .station-modal p{ color:var(--text-dim); font-size:14px; margin:0 0 18px 0; line-height:1.55;}
  .station-modal input{ width:100%; background:var(--bg); border:1px solid var(--surface-3); color:var(--text); font-family:var(--mono); font-size:15px; padding:12px 13px; border-radius:7px; outline:none; margin-bottom:16px; }
  .station-modal input:focus{ border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-wash);}
  .wh-title{ font-size:15px; font-weight:600; }
  .wh-dot{ display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--ok); margin-right:9px; }
  .console-body{ padding:18px; }

  .section-label{ font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-dim); margin-bottom:9px; font-family:var(--mono);}

  .kit-picker{ display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:8px; margin-bottom:20px; }
  .kit-card{ text-align:left; background:var(--surface-2); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:10px 12px; cursor:pointer; display:flex; flex-direction:column; gap:3px; font-size:13.5px; line-height:1.35; }
  .kit-card:hover{ border-color:var(--accent); }
  .kit-card.active{ border-color:var(--accent); background:var(--accent-wash); box-shadow:0 0 0 1px var(--accent) inset; }
  .kit-card.auto{ border-style:dashed; }
  .kit-card.detected{ border-color:var(--ok); background:var(--ok-dim); }
  .kit-card.disabled{ opacity:.45; cursor:not-allowed; }
  .kit-card.disabled:hover{ border-color:var(--border); }
  .kit-card-code{ font-family:var(--mono); font-size:12px; color:var(--text-dim); }
  .kit-card-note{ font-size:12px; color:var(--warn); }

  .checklist{ display:flex; flex-direction:column; gap:5px; margin-bottom:18px; }
  .check-row{ display:flex; align-items:center; gap:11px; padding:9px 12px; border-radius:7px; background:var(--surface-2); border:1px solid var(--border); color:var(--text-dim); transition:background-color .15s, border-color .15s, color .15s; }
  .check-mark{ width:20px; height:20px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; background:var(--surface-3); border:1px solid var(--border); font-size:12px; font-weight:700; color:transparent; }
  .check-name{ flex:1; font-size:14px; }
  .check-tag{ font-family:var(--mono); font-size:11px; padding:1px 6px; border-radius:4px; border:1px solid var(--border); color:var(--text-faint); }
  .check-count{ font-family:var(--mono); font-size:12.5px; min-width:30px; text-align:right; }
  .check-row.partial{ border-color:var(--warn); }
  .check-row.partial .check-mark{ border-color:var(--warn); }
  .check-row.done{ background:var(--ok-dim); border-color:var(--ok); color:var(--text); }
  .check-row.done .check-mark{ background:var(--ok); border-color:var(--ok); color:#0E1A13; }
  .check-row.done .check-tag{ border-color:var(--ok); color:var(--ok); }
  .check-row.agg{ margin-top:4px; border-style:dashed; }
  .check-row.agg.ready{ border-color:var(--accent); border-style:solid; background:var(--accent-wash); color:var(--text); }
  .check-empty{ color:var(--text-dim); font-size:14px; padding:14px 4px; }

  .scan-input-row{ display:flex; gap:8px; }
  input.scan-input{ flex:1; background:var(--bg); border:1px solid var(--surface-3); color:var(--text); font-family:var(--mono); font-size:17px; padding:13px 14px; border-radius:8px; outline:none; }
  input.scan-input:focus{ border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-wash);}
  .scan-hint{ font-size:13.5px; color:var(--text-dim); margin-top:10px; min-height:18px;}
  .scan-hint.err{ color:var(--err); }
  .scan-hint.ok{ color:var(--ok); }

  .progress-row{ display:flex; gap:20px; margin-top:20px; flex-wrap:wrap;}
  .progress-block{ flex:1; min-width:130px;}
  .progress-label{ font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-dim); margin-bottom:7px; font-family:var(--mono);}
  .count-badge{ font-family:var(--mono); font-size:13.5px; color:var(--text); }

  .feed{ margin-top:20px; border-top:1px solid var(--border); padding-top:12px; max-height:220px; overflow-y:auto; }
  .feed-line{ font-family:var(--mono); font-size:13px; padding:5px 0; display:flex; gap:10px; border-bottom:1px solid var(--surface-2);}
  .feed-time{ color:var(--text-faint); flex-shrink:0; }
  .feed-line.ok .feed-msg{ color:var(--ok); }
  .feed-line.error .feed-msg{ color:var(--err); }
  .feed-line.info .feed-msg{ color:var(--text-dim); }



  .badge{ font-size:11px; padding:2px 7px; border-radius:4px; background:var(--surface); border:1px solid var(--border); color:var(--text-dim); margin-left:7px;}

  .btn{ background:var(--accent); color:#0F1720; border:none; font-weight:600; font-size:14px; padding:10px 18px; border-radius:7px; cursor:pointer; }
  .btn:hover{ filter:brightness(1.1); }

  .empty{ color:var(--text-dim); font-size:14px; padding:34px 10px; text-align:center; }
  .note{ font-size:13.5px; color:var(--text-dim); margin-top:10px; line-height:1.6; }
</style>
<link rel="stylesheet" href="layout.css">
</head>
<body>
<header>
  <h1>Сборка наборов — КМ-трекинг</h1>
  <div class="header-status">
    <span class="station-badge" id="station-badge" title="Сменить станцию">станция: …</span>
    <div class="conn-status" id="conn-status"><span class="conn-dot" id="conn-dot"></span><span id="conn-text">подключение…</span></div>
  </div>
</header>
<main>

  <!-- ===================== СБОРКА ===================== -->
  <section id="view-assembly" class="view active">
    <div class="consoles" id="consoles-root"></div>
  </section>

</main>

<!-- Модалка запрашивается один раз на этот браузер/ПК, дальше id хранится в localStorage -->
<div id="station-modal-backdrop" class="station-modal-backdrop" style="display:none;">
  <div class="station-modal">
    <h2>Название станции</h2>
    <p>Укажите номер или имя рабочего места (например «Стол 5» или имя оператора). Это нужно, чтобы сервер не путал наборы разных станций между собой. Значение запомнится в этом браузере.</p>
    <input id="station-input" placeholder="Например: Стол 5" maxlength="64" autocomplete="off">
    <button class="btn" id="station-confirm" style="width:100%;">Начать работу</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
