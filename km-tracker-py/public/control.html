<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Контроль — КМ-трекинг</title>
<style>
  :root{ --bg:#14171C; --surface:#1A1E24; --surface-2:#20252C; --surface-3:#2A3039; --border:#333A44;
    --text:#EDEFF2; --text-dim:#8E97A3; --accent:#6C97C2; --warn:#D8AB55; --err:#D9686C;
    --mono:ui-monospace,"SFMono-Regular",Consolas,Menlo,monospace;
    --sans:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--bg); color:var(--text); font-family:var(--sans); font-size:15px; line-height:1.55; }
  .wrap{ max-width:1320px; margin:0 auto; padding:24px 28px 64px; }
  .top{ display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:18px; }
  h1{ font-size:22px; font-weight:600; margin:0; }
  a.link{ color:var(--accent); text-decoration:none; font-size:14px; }
  a.link:hover{ text-decoration:underline; }
  .stat-strip{ display:flex; gap:12px; margin-bottom:8px; flex-wrap:wrap; }
  .stat{ background:var(--surface); border:1px solid var(--border); border-radius:9px; padding:12px 18px; min-width:128px; }
  .stat-num{ font-size:25px; font-weight:600; }
  .stat-label{ font-size:12px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.05em; margin-top:2px; }
  .section-title{ font-size:16px; font-weight:600; margin:26px 0 10px; }
  .section-title small{ color:var(--text-dim); font-weight:400; font-size:13px; margin-left:8px; }
  .table-wrap{ overflow-x:auto; margin-bottom:8px; }
  table.stations{ width:100%; border-collapse:collapse; font-size:14px; }
  table.stations th{ text-align:left; padding:10px 11px; background:var(--surface-2); color:var(--text-dim); font-size:11.5px; text-transform:uppercase; letter-spacing:.05em; border-bottom:1px solid var(--border); white-space:nowrap; }
  table.stations td{ padding:9px 11px; border-bottom:1px solid var(--border); font-family:var(--mono); font-size:13px; }
  table.stations tr.total td{ font-weight:600; background:var(--surface); }
  table.stations td.err-high{ color:var(--err); }
  .note{ font-size:13.5px; color:var(--text-dim); margin-top:8px; line-height:1.6; }
  .search-row{ display:flex; gap:8px; margin-bottom:18px; }
  .search-row input{ flex:1; background:var(--surface); border:1px solid var(--border); color:var(--text); font-family:var(--mono); font-size:14.5px; padding:11px 13px; border-radius:7px; outline:none; }
  .search-row input:focus{ border-color:var(--accent); }
  .btn{ background:transparent; border:1px solid var(--border); color:var(--text-dim); font-size:14px; padding:10px 18px; border-radius:7px; cursor:pointer; }
  .btn:hover{ border-color:var(--text-dim); color:var(--text); }
  .tree{ font-family:var(--mono); font-size:14px; }
  details.pallet{ background:var(--surface); border:1px solid var(--border); border-radius:9px; margin-bottom:9px; padding:9px 13px; }
  details.box{ background:var(--surface-2); border:1px solid var(--border); border-radius:7px; margin:7px 0; padding:7px 11px; }
  details.kit{ background:var(--surface-3); border-radius:6px; margin:6px 0; padding:6px 10px; }
  summary{ cursor:pointer; }
  .code{ color:var(--accent); }
  .item-row{ padding:4px 0 4px 15px; color:var(--text-dim); border-left:2px solid var(--border); margin-left:4px; }
  .badge{ font-size:11px; padding:2px 7px; border-radius:4px; background:var(--surface); border:1px solid var(--border); color:var(--text-dim); margin-left:7px; }
  .badge.open{ background:var(--warn); border-color:var(--warn); color:#241c08; }
  .empty{ color:var(--text-dim); font-size:14px; padding:34px 10px; text-align:center; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>Контроль</h1>
    <a class="link" href="/report">Отчёт для ТО →</a>
  </div>

  <div class="stat-strip" id="stat-strip"></div>

  <div class="section-title">Работа столов за сегодня <small id="stations-date"></small></div>
  <div class="table-wrap">
    <table class="stations">
      <thead><tr>
        <th>Стол</th><th>Наборов</th><th>Товаров</th><th>Сканов</th><th>Ошибок</th>
        <th title="Доля сканов с ошибкой">% ошибок</th>
        <th title="Медиана времени от первого скана до закрытия набора">Время на набор</th>
        <th title="Наборов за час между первым и последним сканом (считается после 10 минут работы)">Наборов/час</th>
        <th>Начал</th><th>Последний скан</th>
      </tr></thead>
      <tbody id="stations-body"></tbody>
    </table>
  </div>
  <div class="note" id="stations-note"></div>

  <div class="section-title">Все коды</div>
  <div class="search-row">
    <input id="search-input" placeholder="Поиск по любому коду (товар / набор / короб / паллета)…">
    <button class="btn" id="tree-refresh" type="button">Обновить</button>
  </div>
  <div id="tree-root" class="tree"></div>
</div>
<script src="control.js"></script>
</body>
</html>
